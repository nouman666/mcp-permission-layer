   <g id="text_1">
    <text style="font-style: italic; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #444444" x="267.48" y="56.523736" transform="rotate(-0 267.48 56.523736)">Runs for every tool call  |  No client/server source change</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="267.48" y="111.529978" transform="rotate(-0 267.48 111.529978)">1. Client issues tool call (name + arguments)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="267.48" y="165.422816" transform="rotate(-0 267.48 165.422816)">2. EnforcementProxy.handle_tool_call()</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(195.918047 213.914422)">3. InferCategories (3 layers)</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(189.844453 224.716883)">name + args + sensitive paths</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(193.289062 272.706608)">4. Policy lookup per category</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(204.735937 283.509069)">(default-deny if missing)</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="267.48" y="336.900025" transform="rotate(-0 267.48 336.900025)">5. Restriction checks (paths / domains)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(243.785 404.104209)">Aggregate</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(220.97875 413.706397)">Deny &gt; Ask &gt; Allow?</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(85.774325 478.917534)">DENY</text>
