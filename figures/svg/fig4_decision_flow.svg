   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(258.404375 478.917534)">ASK</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(234.3125 488.519722)">ask_handler or</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(230.50125 498.121909)">fail-closed DENY</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(421.025675 478.917847)">ALLOW</text>
